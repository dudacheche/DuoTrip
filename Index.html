<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoTrip - O Diário de Viagens do Seu Amor ❤️</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #0f051d 0%, #1a0933 50%, #0d031a 100%);
            color: #f8fafc;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* MENU DE NAVEGAÇÃO DA LANDING PAGE */
        .menu {
            background: rgba(20, 10, 35, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(244, 114, 182, 0.15);
        }

        .menu-logo {
            font-weight: bold;
            color: #ff4d8d;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-cta-menu {
            background: linear-gradient(135deg, #ff4d8d, #e11d48);
            color: white;
            padding: 9px 20px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 77, 141, 0.3);
            transition: all 0.2s;
        }

        .btn-cta-menu:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(255, 77, 141, 0.45);
        }

        /* HERO / APRESENTAÇÃO PRINCIPAL */
        .hero {
            padding: 90px 20px 60px;
            text-align: center;
            max-width: 850px;
            margin: 0 auto;
        }

        .tag-romantica {
            display: inline-block;
            background: rgba(255, 77, 141, 0.12);
            border: 1px solid rgba(255, 77, 141, 0.3);
            color: #ff75a0;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(2.3rem, 5vw, 4rem);
            color: #ffffff;
            margin-bottom: 22px;
            line-height: 1.2;
            font-weight: 800;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #ff75a0, #ff2e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(1.05rem, 2.5vw, 1.3rem);
            color: #cbd5e1;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .btn-principal {
            display: inline-block;
            background: linear-gradient(135deg, #ff4d8d 0%, #ff2e63 100%);
            color: #ffffff;
            font-weight: bold;
            padding: 18px 38px;
            border-radius: 30px;
            font-size: 1.15rem;
            text-decoration: none;
            box-shadow: 0 12px 30px rgba(255, 46, 99, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
