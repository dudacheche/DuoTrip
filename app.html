<!DOCTYPE html>
< lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoTrip — Nosso Acervo na Estrada ❤️</title>

    <!-- Supabase JS SDK blindado -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        /* CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #180814 0%, #280f23 50%, #180814 100%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO DO CASAL) */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: rgba(42, 18, 37, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.28);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        }

        .auth-card h2 {
            color: #f472b6;
            margin-bottom: 8px;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(244, 114, 182, 0.25);
        }

        .auth-card p {
            color: #fce7f3;
            font-size: 0.95rem;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            color: #ffffff;
            font-weight: bold;
            padding: 13px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-auth:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(225, 29, 72, 0.55);
        }

        .btn-auth-secondary {
            background: rgba(244, 114, 182, 0.12);
            border: 1px solid rgba(244, 114, 182, 0.35);
            color: #fce7f3;
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-auth-secondary:hover {
            background: rgba(244, 114, 182, 0.22);
            box-shadow: none;
        }

        /* CONTAINER PRINCIPAL DO APP */
        #app-container {
            display: none;
        }

        /* MENU DE NAVEGAÇÃO */
        .menu {
            background: rgba(35, 14, 30, 0.92);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(225, 29, 72, 0.25);
        }

        .menu-logo {
            font-weight: bold;
            color: #f472b6;
            font-size: 1.15rem;
            cursor: pointer;
        }

        .menu-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .menu-links a,
        .menu-links button {
            color: #fce7f3;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
            background: none;
            border: none;
            font-size: 0.98rem;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .menu-links a:hover,
        .menu-links button:hover {
            color: #f472b6;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: #fce7f3;
            font-size: 1.8rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .menu-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(35, 14, 30, 0.98);
                padding: 20px;
                border-bottom: 1px solid rgba(225, 29, 72, 0.25);
                text-align: center;
                gap: 15px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            }

            .menu-links.ativo {
                display: flex !important;
            }
        }

        /* HERO BANNER */
        .hero {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: #180814;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            z-index: 0;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(24, 8, 20, 0.35), rgba(24, 8, 20, 0.78));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2rem, 7vw, 3.5rem);
            margin: 0 0 10px;
            color: #ffffff;
            text-shadow: 0 0 24px rgba(244, 114, 182, 0.35);
        }

        .hero p {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            color: #fce7f3;
            margin: 0;
        }

        /* DASHBOARD & ESTATÍSTICAS */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: rgba(42, 18, 37, 0.72);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 18px 12px;
            text-align: center;
            border: 1px solid rgba(244, 114, 182, 0.22);
        }

        .card h2 {
            margin-bottom: 4px;
            font-size: 1.6rem;
            color: #f472b6;
        }

        .card p {
            font-size: 0.9rem;
            color: #fce7f3;
            opacity: 0.88;
        }

        /* BARRA DE META */
        .meta {
            max-width: 700px;
            margin: 10px auto 20px;
            padding: 0 20px;
            text-align: center;
        }

        .meta h3 {
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .barra {
            width: 100%;
            height: 22px;
            background: rgba(24, 8, 20, 0.85);
            border-radius: 50px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        #progresso {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f472b6 0%, #e11d48 100%);
            transition: width 0.5s ease;
        }

        #textoMeta {
            text-align: center;
            margin-top: 6px;
            color: #fce7f3;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* GARAGEM */
        #garagem {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .titulo {
            text-align: center;
            margin: 30px 0 18px;
            font-size: 1.75rem;
            color: #ffffff;
        }

        .garagem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .moto-card-compacto {
            padding: 16px 14px;
            border-radius: 16px;
            background: rgba(42, 18, 37, 0.72);
            border: 1px solid rgba(244, 114, 182, 0.22);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: border-color 0.25s ease;
        }

        .moto-card-compacto:hover {
            border-color: rgba(244, 114, 182, 0.45);
        }

        .moto-card-compacto h3 {
            margin: 0 0 8px;
            color: #f472b6;
            font-size: 15.5px;
            line-height: 1.2;
        }

        .moto-card-compacto p {
            margin: 4px 0;
            color: #fce7f3;
            font-size: 12.5px;
            line-height: 1.35;
            opacity: 0.88;
        }

        .moto-card-compacto p strong {
            color: #ffffff;
        }

        .moto-card-compacto .km-destaque {
            color: #f472b6;
            font-weight: bold;
        }

        /* LISTA DE VIAGENS */
        #viagens {
            max-width: 1000px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        #listaViagens {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .viagem-card {
            position: relative;
            overflow: hidden;
            padding: 20px;
            background: rgba(42, 18, 37, 0.75);
            color: #ffffff;
            border: 1px solid rgba(244, 114, 182, 0.22);
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s ease, border-color 0.25s ease;
            cursor: pointer;
        }

        .viagem-card:hover {
            transform: translateY(-4px);
            border-color: rgba(244, 114, 182, 0.5);
        }

        .viagem-capa {
            display: block;
            width: calc(100% + 40px);
            height: 170px;
            margin: -20px -20px 18px;
            object-fit: cover;
            object-position: center;
            border-radius: 17px 17px 0 0;
            background: #280f23;
        }

        .viagem-topo {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .viagem-etiqueta {
            padding: 5px 10px;
            background: rgba(225, 29, 72, 0.2);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.25);
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
        }

        .viagem-data {
            color: #fda4af;
            font-size: 12px;
        }

        .viagem-cidade {
            margin: 0 0 8px;
            color: #ffffff;
            font-size: 20px;
            line-height: 1.3;
        }

        .viagem-descricao {
            margin: 0 0 16px;
            color: #fce7f3;
            font-size: 13px;
            line-height: 1.5;
            opacity: 0.85;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .viagem-distancia {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 14px;
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid rgba(244, 114, 182, 0.25);
            border-radius: 12px;
        }

        .viagem-icone {
            font-size: 22px;
        }

        .viagem-texto-distancia {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .viagem-km {
            color: #f472b6;
            font-size: 20px;
            line-height: 1.2;
            font-weight: bold;
        }

        .viagem-legenda {
            color: #fce7f3;
            font-size: 11px;
            opacity: 0.85;
        }

        .btn-abrir-album {
            width: 100%;
            padding: 10px;
            background: rgba(225, 29, 72, 0.22);
            border: 1px solid rgba(244, 114, 182, 0.45);
            color: #ffffff;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            transition: all 0.2s;
        }

        .viagem-card:hover .btn-abrir-album {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            border-color: transparent;
            color: #ffffff;
        }

        /* MODAIS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 4, 12, 0.88);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.escondido {
            display: none !important;
        }

        .modal-container {
            background: #230e1e;
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 20px;
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(244, 114, 182, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #180814;
        }

        .modal-header h3 {
            color: #f472b6;
            font-size: 1.25rem;
        }

        .modal-header .fechar {
            background: none;
            border: none;
            color: #fce7f3;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        /* FORMULÁRIOS & ADMIN */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #f472b6;
            font-size: 0.85rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #180814;
            border: 1px solid rgba(244, 114, 182, 0.25);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: #f472b6;
        }

        .btn-primario {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn-primario:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(225, 29, 72, 0.5);
        }

        .btn-secundario {
            background: rgba(244, 114, 182, 0.12);
            color: #fce7f3;
            border: 1px solid rgba(244, 114, 182, 0.3);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-secundario:hover {
            background: rgba(244, 114, 182, 0.22);
        }

        .btn-excluir {
            border-color: rgba(251, 113, 133, 0.5);
            color: #fda4af;
        }

        .admin-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(244, 114, 182, 0.18);
            padding-bottom: 10px;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            background: #180814;
            border: 1px solid rgba(244, 114, 182, 0.2);
            color: #fce7f3;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .tab-btn.ativa {
            background: rgba(225, 29, 72, 0.22);
            border-color: #f472b6;
            color: #f472b6;
        }

        .autenticado {
            color: #f472b6;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .form-titulo {
            color: #f472b6;
            margin-bottom: 14px;
        }

        .form-duas-colunas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .preview-capa {
            display: none;
            margin-top: 10px;
        }

        .preview-capa img {
            max-width: 100%;
            max-height: 160px;
            object-fit: contain;
            border-radius: 8px;
        }

        .btn-cancelar {
            display: none;
            width: 100%;
            margin-top: 8px;
        }

        .separador {
            border: 0;
            border-top: 1px solid rgba(244, 114, 182, 0.2);
            margin: 22px 0;
        }

        .admin-lista {
            display: grid;
            gap: 8px;
        }

        .admin-viagem-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #180814;
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 12px;
        }

        .admin-destino {
            display: block;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .admin-km {
            color: #f472b6;
            font-size: 0.8rem;
        }

        /* CARROSSEL ÁLBUM */
        .carrossel {
            position: relative;
            background: #12050f;
            border-radius: 14px;
            overflow: hidden;
            height: 330px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        .carrossel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .carrossel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(24, 8, 20, 0.72);
            color: #ffffff;
            border: 1px solid rgba(244, 114, 182, 0.35);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carrossel-btn.prev {
            left: 10px;
        }

        .carrossel-btn.next {
            right: 10px;
        }

        .carrossel-contador {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(24, 8, 20, 0.85);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        .galeria-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.45;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .thumb.ativa {
            opacity: 1;
            border-color: #f472b6;
        }

        .previsualizacao-fotos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .mini-preview {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #f472b6;
        }

        .modal-subtitulo {
            color: #fda4af;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .modal-relato {
            color: #fce7f3;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-top: 15px;
            opacity: 0.9;
        }

        /* TOAST NOTIFICAÇÃO */
        #toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: bold;
            z-index: 3000;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.45);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        #toast.visivel {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .hero {
                height: 320px;
            }

            .dashboard-grid {
                gap: 10px;
                padding: 14px;
            }

            .card {
                padding: 15px 8px;
            }

            .card h2 {
                font-size: 1.35rem;
            }

            .card p {
                font-size: 0.78rem;
            }

            .titulo {
                font-size: 1.5rem;
            }

            .form-duas-colunas {
                grid-template-columns: 1fr;
            }

            .modal-overlay {
                padding: 10px;
            }

            .modal-container {
                max-height: 95vh;
            }

            .modal-body {
                padding: 15px;
            }

            .carrossel {
                height: 260px;
            }
        }
    </style>
</head>
